<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baseball Greeks — zStuff Leaderboards</title>
<meta name="description" content="zStuff leaderboards and pitcher greeks: pitch quality graded from physical characteristics alone, with sensitivities to velocity and movement.">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css?v=16">
</head>
<body>

<div class="topbar">
  <a class="brand" href="index.html"><span class="delta">Δ</span> Baseball Greeks</a>
  <nav class="nav">
    <a href="index.html" class="active">Leaderboards</a>
    <a href="pitcher.html">Pitchers</a>
    <a href="glossary.html">Glossary</a>
    <a href="research.html">Research</a>
  </nav>
</div>

<div class="wrap">
  <h1 id="title">zStuff Leaderboard</h1>

  <div class="controls">
    <div class="seg" id="ptseg"></div>
    <div class="spacer"></div>
    <select id="season" aria-label="Season"></select>
    <select id="minn" aria-label="Minimum pitches">
      <option value="1" selected>1+ pitches</option>
      <option value="10">10+ pitches</option>
      <option value="50">50+ pitches</option>
      <option value="100">100+ pitches</option>
      <option value="200">200+ pitches</option>
      <option value="500">500+ pitches</option>
    </select>
    <input type="search" id="q" placeholder="Filter pitchers…" aria-label="Filter pitchers">
  </div>

  <div class="card">
    <div class="tablewrap">
      <table id="lb">
        <thead><tr>
          <th class="l" data-k="rank">#</th>
          <th class="l" data-k="name">Pitcher</th>
          <th data-k="n">Pitches</th>
          <th data-k="z" title="Stuff grade: z-score within season × pitch type">zStuff</th>
          <th class="grp" data-k="velo" title="Average release speed (mph)">Velo</th>
          <th data-k="d" title="Δ — change in stuff per +1 mph, along the manifold">Delta</th>
          <th data-k="g" title="Γ — change in delta per +1 mph (curvature)">Gamma</th>
          <th class="grp" data-k="ivb" title="Induced vertical break, release to plate (inches, ride-positive)">IVB</th>
          <th data-k="vz" title="ν_z — change in zStuff per +1 inch of IVB">Vega-Z</th>
          <th class="grp" data-k="hb" title="Horizontal break, release to plate (inches, glove-side positive: + cut, − run)">HB</th>
          <th data-k="vx" title="ν_x — change in zStuff per +1 inch of HB">Vega-X</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="empty" id="empty" hidden>No pitchers match.</div>
  </div>
</div>

<footer>
  <p>Data: MLB Statcast via Baseball Savant, 2020&ndash;2026. A project by
     <a href="https://aidanresnick.com" style="color:var(--ink-2)">Aidan Resnick</a>.</p>
</footer>

<script src="assets/common.js?v=16"></script>
<script src="assets/leaderboard.js?v=16"></script>
</body>
</html>
